# Sujets du benchmark V0 — Phassyl
# Mots-clés = hypothèses (pas encore de données de volume : Treg non branché).
# status: ready | pending  → seuls les sujets "ready" sont générés.
# manual_urls : utilisées par ManualUrlsProvider (mode --search manual|both).
# preferred_source_domains : interrogés en premier par WebSearchProvider.

client: phassyl

topics:
  - id: geneve-co-college
    type: local_commercial
    status: ready
    title: "Du cycle d'orientation au collège de Genève : conditions de passage et comment bien préparer la 11e"
    primary_keyword: "passage cycle d'orientation collège Genève"
    secondary_keywords: ["conditions admission collège de Genève", "11e cycle d'orientation", "appui scolaire Genève"]
    intent: informational
    audience: "Parents d'élèves du CO genevois (9e–11e)"
    risk_level: standard
    business_value: medium
    conversion_target:
      primary: https://phassyl.ch/appui-scolaire-geneve/
      action: "Demande de cours d'essai offert"
    cannibalization_note: >
      Trois pages visent déjà « soutien/appui scolaire Genève » (/appui-scolaire-geneve/,
      /soutien-scolaire-personnalise-a-geneve/, /aide-scolaire-apres-lecole-a-geneve/).
      Cet article vise une intention informationnelle distincte (transition CO → collège) et
      renvoie vers /appui-scolaire-geneve/ comme page commerciale. Il ne doit PAS cibler
      « soutien scolaire Genève » dans son titre, H1 ou slug.
    preferred_source_domains: ["ge.ch"]
    manual_urls:
      - https://www.ge.ch/document/7366/telecharger   # PDF « Admission des élèves depuis le CO »
      - https://www.ge.ch/document/processus-inscription-es-ii-eleves-issus-du-cycle-orientation-co
      - https://www.ge.ch/inscription-enseignement-secondaire-ii/inscriptions-scolarites-provenance
      - https://edu.ge.ch/secondaire2/system/files/organisations/saus/documents/2026-01/PresentationCdGR26_0.pdf
      - https://edu.ge.ch/secondaire1/gradelle/enseignements-orientation/promotion

