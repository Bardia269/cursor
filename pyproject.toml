[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-os"
version = "0.1.0"
description = "Système interne de production SEO assisté par IA — V0 (pipeline + benchmark)"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.26,<4",
    "anthropic>=1.12,<2",
    "pydantic>=2.7,<3",
    "PyYAML>=6",
    "Jinja2>=3.1",
    "python-dotenv>=1.0",
    "trafilatura>=2.0,<3",
    "pypdf>=4",
    "Markdown>=3.5",
    "sympy>=1.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
seo-os = "seo_os.cli:main"

[tool.setuptools]
packages = ["seo_os", "seo_os.web"]

[tool.setuptools.package-data]
"seo_os.web" = ["templates/*.html", "static/*", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
